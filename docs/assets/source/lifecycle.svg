<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" font-family="Inter, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05110f"/>
      <stop offset="0.6" stop-color="#061820"/>
      <stop offset="1" stop-color="#0a2029"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d3a0"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d3a0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#15323c" stroke-width="1" opacity="0.45"/>
    </pattern>
  </defs>
  <rect width="1600" height="600" fill="url(#bg)"/>
  <rect width="1600" height="600" fill="url(#grid)"/>

  <g transform="translate(80,54)">
    <text x="0" y="16" fill="#a7f3d3" font-size="12" letter-spacing="3" font-weight="600">ORDER SIGNAL PATH · VALIDATED AT EVERY EDGE</text>
    <text x="0" y="60" fill="#ecfdf6" font-size="38" font-weight="800" letter-spacing="-1">From cart to doorstep, without a silent jump.</text>
    <text x="0" y="92" fill="#7f9aa5" font-size="14">A single state machine decides what may happen next — and which role may do it.</text>
  </g>

  <g transform="translate(100,180)">
    <path d="M0 80H1420" stroke="#17313d" stroke-width="2"/>
    <path d="M0 80H1420" stroke="url(#line)" stroke-width="2" opacity="0.45"/>
    <g font-size="12">
      <!-- 1 -->
      <circle cx="60" cy="80" r="26" fill="#0b2a26" stroke="#34d3a0" stroke-width="2"/>
      <text x="60" y="86" fill="#a7f3d3" font-size="15" font-weight="700" text-anchor="middle">01</text>
      <text x="60" y="136" fill="#ecfdf6" font-size="14" font-weight="600" text-anchor="middle">Cart verified</text>
      <text x="60" y="158" fill="#7f9aa5" font-size="11" text-anchor="middle">stock · radius · minimum</text>
      <!-- 2 -->
      <circle cx="300" cy="80" r="26" fill="#0a232a" stroke="#38bdf8" stroke-width="2"/>
      <text x="300" y="86" fill="#7dd3fc" font-size="15" font-weight="700" text-anchor="middle">02</text>
      <text x="300" y="136" fill="#ecfdf6" font-size="14" font-weight="600" text-anchor="middle">Order placed</text>
      <text x="300" y="158" fill="#7f9aa5" font-size="11" text-anchor="middle">idempotency key · ACID</text>
      <!-- 3 -->
      <circle cx="540" cy="80" r="26" fill="#0a232a" stroke="#38bdf8" stroke-width="2"/>
      <text x="540" y="86" fill="#7dd3fc" font-size="15" font-weight="700" text-anchor="middle">03</text>
      <text x="540" y="136" fill="#ecfdf6" font-size="14" font-weight="600" text-anchor="middle">Prescription gate</text>
      <text x="540" y="158" fill="#7f9aa5" font-size="11" text-anchor="middle">pharmacist approval</text>
      <!-- 4 -->
      <circle cx="780" cy="80" r="26" fill="#0a232a" stroke="#38bdf8" stroke-width="2"/>
      <text x="780" y="86" fill="#7dd3fc" font-size="15" font-weight="700" text-anchor="middle">04</text>
      <text x="780" y="136" fill="#ecfdf6" font-size="14" font-weight="600" text-anchor="middle">Pharmacy prepares</text>
      <text x="780" y="158" fill="#7f9aa5" font-size="11" text-anchor="middle">accept → pack → ready</text>
      <!-- 5 -->
      <circle cx="1020" cy="80" r="26" fill="#0a232a" stroke="#38bdf8" stroke-width="2"/>
      <text x="1020" y="86" fill="#7dd3fc" font-size="15" font-weight="700" text-anchor="middle">05</text>
      <text x="1020" y="136" fill="#ecfdf6" font-size="14" font-weight="600" text-anchor="middle">Partner assigned</text>
      <text x="1020" y="158" fill="#7f9aa5" font-size="11" text-anchor="middle">nearest online rider</text>
      <!-- 6 -->
      <circle cx="1260" cy="80" r="26" fill="#0b2a26" stroke="#34d3a0" stroke-width="2"/>
      <text x="1260" y="86" fill="#a7f3d3" font-size="15" font-weight="700" text-anchor="middle">06</text>
      <text x="1260" y="136" fill="#ecfdf6" font-size="14" font-weight="600" text-anchor="middle">OTP handover</text>
      <text x="1260" y="158" fill="#7f9aa5" font-size="11" text-anchor="middle">verified delivery</text>
    </g>

    <g fill="#34d3a0" opacity="0.7">
      <circle cx="150" cy="80" r="3"/><circle cx="210" cy="80" r="3"/><circle cx="390" cy="80" r="3"/>
      <circle cx="450" cy="80" r="3"/><circle cx="630" cy="80" r="3"/><circle cx="690" cy="80" r="3"/>
      <circle cx="870" cy="80" r="3"/><circle cx="930" cy="80" r="3"/><circle cx="1110" cy="80" r="3"/>
      <circle cx="1170" cy="80" r="3"/>
    </g>

    <!-- exception lane -->
    <path d="M540 110V236" stroke="#1f4a55" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M780 110V236" stroke="#1f4a55" stroke-width="1.5" stroke-dasharray="4 5"/>
    <g transform="translate(380,244)">
      <rect x="0" y="0" width="300" height="64" rx="12" fill="#0a232a" stroke="#1b3b46"/>
      <text x="16" y="26" fill="#fcd34d" font-size="12" font-weight="700">PRESCRIPTION_REJECTED</text>
      <text x="16" y="47" fill="#7f9aa5" font-size="11">refund path · admin only</text>
    </g>
    <g transform="translate(700,244)">
      <rect x="0" y="0" width="330" height="64" rx="12" fill="#0a232a" stroke="#1b3b46"/>
      <text x="16" y="26" fill="#f9a8d4" font-size="12" font-weight="700">CANCELLATION_REQUESTED</text>
      <text x="16" y="47" fill="#7f9aa5" font-size="11">pharmacy approves · reason stored</text>
    </g>
    <g transform="translate(1060,244)">
      <rect x="0" y="0" width="300" height="64" rx="12" fill="#0a232a" stroke="#1b3b46"/>
      <text x="16" y="26" fill="#7dd3fc" font-size="12" font-weight="700">REFUND_PENDING → REFUNDED</text>
      <text x="16" y="47" fill="#7f9aa5" font-size="11">gateway reference recorded</text>
    </g>

    <!-- invariants -->
    <g transform="translate(0,360)">
      <rect x="0" y="0" width="1420" height="112" rx="18" fill="#071820" stroke="#1b3b46"/>
      <text x="24" y="32" fill="#a7f3d3" font-size="11" letter-spacing="2">INVARIANTS</text>
      <text x="24" y="60" fill="#cfe6e0" font-size="14">No state is reachable out of order.</text>
      <text x="24" y="84" fill="#7f9aa5" font-size="12">Server flows validate the edge, not the actor. Humans validate both.</text>
      <text x="500" y="60" fill="#cfe6e0" font-size="14">Every transition is appended to history.</text>
      <text x="500" y="84" fill="#7f9aa5" font-size="12">from · to · actor role · reason · timestamp</text>
      <text x="960" y="60" fill="#cfe6e0" font-size="14">Rx orders cannot skip review.</text>
      <text x="960" y="84" fill="#7f9aa5" font-size="12">Checked at placement and again at acceptance.</text>
    </g>
  </g>
</svg>
