<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" font-family="'Space Grotesk','Segoe UI',Roboto,sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#02080d"/>
      <stop offset="0.52" stop-color="#061820"/>
      <stop offset="1" stop-color="#041016"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2fffb"/>
      <stop offset="0.48" stop-color="#b9ffe8"/>
      <stop offset="1" stop-color="#63e6ff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2dd4aa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b3b37"/>
      <stop offset="1" stop-color="#0a2436"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#2dd4aa" stop-opacity="0.20"/>
      <stop offset="0.5" stop-color="#0ea5e9" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#02080d" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#15323c" stroke-width="1" opacity="0.55"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#2dd4aa" opacity="0.18"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#grid)" opacity="0.38"/>
  <rect x="860" y="0" width="740" height="720" fill="url(#dots)" opacity="0.35"/>
  <ellipse cx="1190" cy="330" rx="460" ry="340" fill="url(#halo)"/>
  <ellipse cx="350" cy="650" rx="420" ry="210" fill="#2dd4aa" opacity="0.035" filter="url(#glow)"/>

  <!-- identity -->
  <g transform="translate(88,58)">
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#core)" stroke="#2dd4aa" stroke-opacity="0.55"/>
    <path d="M24 10v28M10 24h28" stroke="#a7f3d3" stroke-width="6" stroke-linecap="round"/>
    <text x="66" y="20" fill="#f2fffb" font-size="18" font-weight="800" letter-spacing="2">MEDIDROP</text>
    <text x="66" y="39" fill="#6f929e" font-size="9.5" letter-spacing="2.8">HYPERLOCAL PHARMACY OS</text>
  </g>

  <g transform="translate(1202,58)">
    <rect x="0" y="0" width="310" height="44" rx="22" fill="#081f25" stroke="#1c4f56"/>
    <circle cx="22" cy="22" r="4" fill="#2dd4aa"/>
    <text x="38" y="26" fill="#b9ffe8" font-size="11" font-weight="700" letter-spacing="1.6">v0.1.6 // HARDENED EDGE</text>
  </g>
  <text x="1512" y="132" text-anchor="end" fill="#54737d" font-size="10" letter-spacing="1.6">22.5726° N · 88.3639° E · KOLKATA</text>

  <!-- headline -->
  <text x="88" y="244" fill="url(#headline)" font-size="92" font-weight="800" letter-spacing="-5">CARE, AT</text>
  <text x="88" y="334" fill="url(#headline)" font-size="92" font-weight="800" letter-spacing="-5">LOCAL VELOCITY.</text>
  <rect x="90" y="364" width="112" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="88" y="408" fill="#9db5be" font-size="17">A hyperlocal health network built around verified stock,</text>
  <text x="88" y="434" fill="#9db5be" font-size="17">pharmacist review, versioned orders and proof of handover.</text>

  <!-- capability chips -->
  <g transform="translate(88,476)" font-size="10.5" font-weight="700" letter-spacing="1.1">
    <g>
      <rect width="174" height="36" rx="18" fill="#071f25" stroke="#1c4f56"/>
      <circle cx="18" cy="18" r="3.5" fill="#2dd4aa"/>
      <text x="32" y="22" fill="#b9ffe8">VERIFIED STOCK</text>
    </g>
    <g transform="translate(186,0)">
      <rect width="196" height="36" rx="18" fill="#071f25" stroke="#1c4f56"/>
      <circle cx="18" cy="18" r="3.5" fill="#38bdf8"/>
      <text x="32" y="22" fill="#b9e9ff">PHARMACIST REVIEW</text>
    </g>
    <g transform="translate(394,0)">
      <rect width="166" height="36" rx="18" fill="#071f25" stroke="#1c4f56"/>
      <circle cx="18" cy="18" r="3.5" fill="#c4b5fd"/>
      <text x="32" y="22" fill="#dcd2ff">OTP HANDOVER</text>
    </g>
  </g>

  <!-- orbital model -->
  <g transform="translate(1188,338)">
    <circle r="252" fill="none" stroke="#1b4650" stroke-width="1" stroke-dasharray="2 7" opacity="0.7"/>
    <circle r="186" fill="none" stroke="#1b4650" stroke-width="1" opacity="0.75"/>
    <circle r="118" fill="none" stroke="#2dd4aa" stroke-width="1" stroke-opacity="0.28"/>
    <circle r="235" fill="#2dd4aa" opacity="0.06" filter="url(#glow)"/>

    <g opacity="0.9">
      <path d="M-186 0H186" stroke="#173a45" stroke-width="1" stroke-dasharray="3 10"/>
      <path d="M0 -186V186" stroke="#173a45" stroke-width="1" stroke-dasharray="3 10"/>
    </g>

    <circle r="82" fill="url(#core)" stroke="url(#accent)" stroke-width="1.5"/>
    <circle r="66" fill="none" stroke="#2dd4aa" stroke-opacity="0.18"/>
    <text x="0" y="-6" text-anchor="middle" fill="#f2fffb" font-size="15" font-weight="800" letter-spacing="1.5">ORDER</text>
    <text x="0" y="16" text-anchor="middle" fill="#a7f3d3" font-size="10" letter-spacing="3">CORE</text>
    <text x="0" y="38" text-anchor="middle" fill="#54737d" font-size="8.5" letter-spacing="1.4">SINGLE TRUTH</text>

    <!-- nodes -->
    <g transform="translate(0,-186)">
      <circle r="34" fill="#071f25" stroke="#2dd4aa" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" fill="#b9ffe8" font-size="10" font-weight="700">STOCK</text>
      <text x="0" y="-48" text-anchor="middle" fill="#54737d" font-size="8.5" letter-spacing="1.5">LEDGER</text>
    </g>
    <g transform="translate(177,-57)">
      <circle r="34" fill="#071f25" stroke="#38bdf8" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" fill="#b9e9ff" font-size="10" font-weight="700">RX</text>
      <text x="42" y="4" fill="#54737d" font-size="8.5" letter-spacing="1.4">REVIEW</text>
    </g>
    <g transform="translate(110,150)">
      <circle r="34" fill="#071f25" stroke="#c4b5fd" stroke-opacity="0.6"/>
      <text x="0" y="4" text-anchor="middle" fill="#dcd2ff" font-size="10" font-weight="700">RIDER</text>
      <text x="42" y="4" fill="#54737d" font-size="8.5" letter-spacing="1.4">PROOF</text>
    </g>
    <g transform="translate(-110,150)">
      <circle r="34" fill="#071f25" stroke="#fcd34d" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffe8a6" font-size="10" font-weight="700">PAY</text>
      <text x="-42" y="4" text-anchor="end" fill="#54737d" font-size="8.5" letter-spacing="1.4">LEDGER</text>
    </g>
    <g transform="translate(-177,-57)">
      <circle r="34" fill="#071f25" stroke="#fb7185" stroke-opacity="0.5"/>
      <text x="0" y="4" text-anchor="middle" fill="#ffc3cd" font-size="10" font-weight="700">AUDIT</text>
      <text x="-42" y="4" text-anchor="end" fill="#54737d" font-size="8.5" letter-spacing="1.4">TRACE</text>
    </g>

    <text x="0" y="282" text-anchor="middle" fill="#54737d" font-size="9" letter-spacing="2.2">ONE ACID BOUNDARY · NO SPLIT-BRAIN STATE</text>
  </g>

  <!-- telemetry rail -->
  <g transform="translate(88,590)">
    <rect width="1424" height="72" rx="18" fill="#05151b" stroke="#173a45"/>
    <line x1="356" y1="0" x2="356" y2="72" stroke="#173a45"/>
    <line x1="712" y1="0" x2="712" y2="72" stroke="#173a45"/>
    <line x1="1068" y1="0" x2="1068" y2="72" stroke="#173a45"/>
    <g transform="translate(24,24)">
      <text x="0" y="0" fill="#54737d" font-size="8.5" letter-spacing="1.8">BACKEND</text>
      <text x="0" y="26" fill="#f2fffb" font-size="20" font-weight="800">52 <tspan fill="#2dd4aa" font-size="9.5" letter-spacing="1.2">PASSED</tspan></text>
    </g>
    <g transform="translate(380,24)">
      <text x="0" y="0" fill="#54737d" font-size="8.5" letter-spacing="1.8">FRONTEND</text>
      <text x="0" y="26" fill="#f2fffb" font-size="20" font-weight="800">13 <tspan fill="#38bdf8" font-size="9.5" letter-spacing="1.2">PASSED</tspan></text>
    </g>
    <g transform="translate(736,24)">
      <text x="0" y="0" fill="#54737d" font-size="8.5" letter-spacing="1.8">LIVE API</text>
      <text x="0" y="26" fill="#f2fffb" font-size="20" font-weight="800">33 <tspan fill="#c4b5fd" font-size="9.5" letter-spacing="1.2">CHECKS</tspan></text>
    </g>
    <g transform="translate(1092,24)">
      <text x="0" y="0" fill="#54737d" font-size="8.5" letter-spacing="1.8">POSTGRESQL 16</text>
      <text x="0" y="26" fill="#f2fffb" font-size="20" font-weight="800">V1–V6 <tspan fill="#fcd34d" font-size="9.5" letter-spacing="1.2">FLYWAY</tspan></text>
    </g>
  </g>

  <text x="88" y="700" fill="#3f5f69" font-size="9" letter-spacing="1.8">PRE-PILOT FOUNDATION · NOT 1.0.0 · HEALTHCARE SOFTWARE REQUIRES LEGAL AND CLINICAL SIGN-OFF</text>
  <text x="1512" y="700" text-anchor="end" fill="#3f5f69" font-size="9" letter-spacing="1.8">BUILT BY ARGHYA BOSE</text>
</svg>
