name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify
        run: mvn -B --no-transfer-progress verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend · typecheck, build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Build (includes typecheck)
        run: npm run build
      - name: Unit tests
        run: npm test
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/dist/
          retention-days: 7

  smoke:
    name: API smoke · PostgreSQL
    runs-on: ubuntu-latest
    needs: backend
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: medidrop
          POSTGRES_USER: medidrop
          POSTGRES_PASSWORD: medidrop
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medidrop -d medidrop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Package API
        working-directory: backend
        run: mvn -B --no-transfer-progress -DskipTests package
      - name: Start API and wait for readiness
        working-directory: backend
        env:
          API_LOG: ${{ github.workspace }}/api-smoke.log
          MEDIDROP_DB_URL: jdbc:postgresql://localhost:5432/medidrop
          MEDIDROP_DB_USERNAME: medidrop
          MEDIDROP_DB_PASSWORD: medidrop
          MEDIDROP_JWT_SECRET: ci-only-medidrop-secret-with-at-least-32-bytes
          MEDIDROP_SEED_ENABLED: 'true'
          MEDIDROP_STORAGE_PATH: /tmp/medidrop-storage
        run: |
          nohup java -jar target/medidrop-api-1.0.0.jar > "$API_LOG" 2>&1 &
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "API ready after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready"
          cat "$API_LOG"
          exit 1
      - name: Run end-to-end smoke suite
        run: bash infrastructure/scripts/smoke-test.sh
      - name: Upload API log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-smoke-log
          path: api-smoke.log
          if-no-files-found: ignore
          retention-days: 7
