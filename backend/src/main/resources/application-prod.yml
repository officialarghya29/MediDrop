spring:
  config:
    activate:
      on-profile: prod
  datasource:
    hikari:
      maximum-pool-size: ${MEDIDROP_DB_POOL_SIZE:30}

springdoc:
  api-docs:
    enabled: ${MEDIDROP_OPENAPI_ENABLED:false}
  swagger-ui:
    enabled: ${MEDIDROP_OPENAPI_ENABLED:false}

medidrop:
  otp:
    expose-in-response: false
  seed:
    enabled: false
  storage:
    provider: ${MEDIDROP_STORAGE_PROVIDER:local}
  payments:
    provider: razorpay
  mail:
    provider: smtp
  sms:
    provider: ${MEDIDROP_SMS_PROVIDER:console}

logging:
  level:
    root: INFO
    com.medidrop: INFO
    org.springframework.web: WARN
