spring:
  application:
    name: medidrop-api
  profiles:
    default: dev
  datasource:
    url: ${MEDIDROP_DB_URL:jdbc:postgresql://localhost:5432/medidrop}
    username: ${MEDIDROP_DB_USERNAME:medidrop}
    password: ${MEDIDROP_DB_PASSWORD:medidrop}
    hikari:
      maximum-pool-size: ${MEDIDROP_DB_POOL_SIZE:20}
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 12MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  compression:
    enabled: true
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

medidrop:
  public-base-url: ${MEDIDROP_PUBLIC_URL:http://localhost:8080}
  frontend-base-url: ${MEDIDROP_FRONTEND_URL:http://localhost:5173}
  jwt:
    secret: ${MEDIDROP_JWT_SECRET:}
    access-token-minutes: ${MEDIDROP_ACCESS_MINUTES:15}
    refresh-token-days: ${MEDIDROP_REFRESH_DAYS:7}
    issuer: medidrop
  cors:
    allowed-origins: ${MEDIDROP_CORS_ORIGINS:http://localhost:5173}
  security:
    trust-forwarded-for: ${MEDIDROP_TRUST_FORWARDED_FOR:false}
  otp:
    length: 6
    expiry-minutes: 10
    expose-in-response: false
    max-attempts: 5
  storage:
    provider: ${MEDIDROP_STORAGE_PROVIDER:local}
    local-path: ${MEDIDROP_STORAGE_PATH:./storage/prescriptions}
    max-file-size-bytes: 5242880
  maps:
    provider: ${MEDIDROP_MAPS_PROVIDER:haversine}
    api-key: ${MEDIDROP_MAPS_API_KEY:}
    base-url: https://maps.googleapis.com/maps/api
    default-delivery-radius-km: 10.0
  payments:
    provider: ${MEDIDROP_PAYMENTS_PROVIDER:sandbox}
    razorpay-key-id: ${RAZORPAY_KEY_ID:}
    razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
    razorpay-webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:}
    razorpay-base-url: https://api.razorpay.com/v1
  mail:
    provider: ${MEDIDROP_MAIL_PROVIDER:console}
    from: ${MEDIDROP_MAIL_FROM:no-reply@medidrop.local}
  sms:
    provider: ${MEDIDROP_SMS_PROVIDER:console}
  delivery:
    base-fee: 25.00
    free-above: 499.00
    fee-per-km: 4.00
    assignment-search-radius-km: 8
  commerce:
    tax-rate-percent: ${MEDIDROP_TAX_PERCENT:5.00}
    cart-max-quantity-per-line: 10
    cancel-window-minutes: 10
  seed:
    enabled: false
    admin-email: ${MEDIDROP_ADMIN_EMAIL:admin@medidrop.local}
    admin-password: ${MEDIDROP_ADMIN_PASSWORD:}
  ocr:
    provider: ${MEDIDROP_OCR_PROVIDER:none}
