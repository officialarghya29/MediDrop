name: medidrop

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medidrop}
      POSTGRES_USER: ${POSTGRES_USER:-medidrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong database password}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medidrop} -d ${POSTGRES_DB:-medidrop}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: 8080
      MEDIDROP_DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-medidrop}
      MEDIDROP_DB_USERNAME: ${POSTGRES_USER:-medidrop}
      MEDIDROP_DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD to a strong database password}
      MEDIDROP_DB_POOL_SIZE: ${MEDIDROP_DB_POOL_SIZE:-20}
      MEDIDROP_JWT_SECRET: ${MEDIDROP_JWT_SECRET:?Set MEDIDROP_JWT_SECRET to a random string of at least 32 characters}
      MEDIDROP_CORS_ORIGINS: ${MEDIDROP_CORS_ORIGINS:-http://localhost:3000}
      MEDIDROP_OPENAPI_ENABLED: ${MEDIDROP_OPENAPI_ENABLED:-false}
      MEDIDROP_PUBLIC_URL: ${MEDIDROP_PUBLIC_URL:-http://localhost:8080}
      MEDIDROP_FRONTEND_URL: ${MEDIDROP_FRONTEND_URL:-http://localhost:3000}
      MEDIDROP_STORAGE_PROVIDER: ${MEDIDROP_STORAGE_PROVIDER:-local}
      MEDIDROP_STORAGE_PATH: /app/storage/prescriptions
      MEDIDROP_PAYMENTS_PROVIDER: ${MEDIDROP_PAYMENTS_PROVIDER:-sandbox}
      MEDIDROP_MAPS_PROVIDER: ${MEDIDROP_MAPS_PROVIDER:-haversine}
      MEDIDROP_MAIL_PROVIDER: ${MEDIDROP_MAIL_PROVIDER:-console}
      MEDIDROP_SMS_PROVIDER: ${MEDIDROP_SMS_PROVIDER:-console}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      MEDIDROP_MAPS_API_KEY: ${MEDIDROP_MAPS_API_KEY:-}
    volumes:
      - storage:/app/storage
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ""
        VITE_WS_URL: ""
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  db-data:
  storage:
